<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle System with Hand Interaction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <div id="canvas-container"></div>

    <video id="input_video" playsinline autoplay muted></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-container">
        <h1>Particle Morph</h1>

        <div class="control-group">
            <div style="display:flex; justify-content:space-between;">
                <label>Particles</label>
                <span id="particle-count-val">20000</span>
            </div>
            <input type="range" id="particle-count" min="5000" max="50000" step="1000" value="20000">
        </div>

        <div class="control-group">
            <div style="display:flex; justify-content:space-between;">
                <label>Force Strength</label>
                <span id="force-val">2.0</span>
            </div>
            <input type="range" id="force-strength" min="0.1" max="5.0" step="0.1" value="2.0">
        </div>

        <div class="control-group">
            <div style="display:flex; justify-content:space-between;">
                <label>Radius/Spread</label>
                <span id="radius-val">1.0</span>
            </div>
            <input type="range" id="shape-radius" min="0.5" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <div style="display:flex; justify-content:space-between;">
                <label>Color</label>
                <span id="color-val">#00ffff</span>
            </div>
            <input type="color" id="particle-color" value="#00ffff"
                style="width:100%; height:32px; border:none; border-radius:4px; padding:0; background:none; cursor:pointer;">
        </div>

        <label>Shapes</label>
        <div class="buttons">
            <button class="active" onclick="setShape('sphere')"><i data-lucide="circle"></i> Sphere</button>
            <button onclick="setShape('cube')"><i data-lucide="box"></i> Cube</button>
            <button onclick="setShape('heart')"><i data-lucide="heart"></i> Heart</button>
            <button onclick="setShape('spiral')"><i data-lucide="tornado"></i> Spiral</button>
            <button onclick="setShape('fire')"><i data-lucide="flame"></i> Fire</button>
            <button onclick="setShape('arrow')"><i data-lucide="arrow-up"></i> Arrow</button>
            <button onclick="setShape('hand')"><i data-lucide="hand"></i> Hand</button>
        </div>

        <button id="start-tracking-btn" style="width:100%">Start Tracking</button>
        <button id="hairline-open-btn" style="width:100%"><i data-lucide="shapes"></i> Hairline Figures</button>

        <div class="status">
            <div style="display:flex; align-items:center;">
                <span id="interaction-indicator"></span>
                <span id="status-text">Ready. Click Start.</span>
            </div>
        </div>
        <div id="voice-status" style="display:none"></div> <!-- Helper for voice log if needed -->
    </div>

    <!-- Hairline Figures -->
    <div id="hairline-overlay" hidden>
        <div id="hairline-header">
            <h1>Hairline Figures</h1>
            <div class="control-group" id="hairline-intensity-group">
                <div style="display:flex; justify-content:space-between;">
                    <label>Intensity</label>
                    <span id="hairline-intensity-val">0.50</span>
                </div>
                <input type="range" id="hairline-intensity" min="0" max="1" step="0.05" value="0.5">
            </div>
            <button id="hairline-close-btn" aria-label="Close"><i data-lucide="x"></i></button>
        </div>
        <div id="hairline-grid"></div>
    </div>

    <!-- Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3",
                "@lucasmarkes/hairline": "https://cdn.jsdelivr.net/npm/@lucasmarkes/hairline@0.2.0/dist/index.js"
            }
        }
    </script>

    <script type="module" src="js/main.js"></script>
    <script type="module">
        import { initHairline } from './js/hairline.js';
        initHairline();
    </script>
</body>

</html>
